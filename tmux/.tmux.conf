# ==========================
# Base Settings
# ==========================
# Enable true color support (crucial for Catppuccin)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0 (makes keyboard navigation easier)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Change prefix from 'Ctrl+B' to 'Ctrl+A' (Optional, but highly recommended by Dreams of Code)
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Vi mode
set-window-option -g mode-keys vi

# Vim-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Tmux sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# ==========================
# Plugins
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# ==========================
# Catppuccin Theme Config
# ==========================
# Pick your flavor (Mocha or Macchiato match the screenshot best)
set -g @catppuccin_flavor 'mocha' 

# ==========================
# Initialize TPM
# ==========================
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
